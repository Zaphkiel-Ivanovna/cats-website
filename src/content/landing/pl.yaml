  body: Całość jest na licencji GPL-3.0-or-later. Pliki z nagłówkiem MIT pochodzą z oryginalnego projektu i go zachowują.
  source: Kod źródłowy
  lineage:
    origin: Oryginał autorstwa Hotoxa i GiveMeAllYourCats.
    upstream: Rozwijany przez Neoneko Team, z osobną linią wydań dla każdej serii Blendera.
