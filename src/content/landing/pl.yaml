hero:
  title: Przygotuj zaimportowane modele do VRChat.
  lead: Cats bierze model, który importer właśnie wrzucił do Blendera, zmienia nazwy kości, scala wagi, łączy siatki i usuwa pozostałości.
  download: Pobierz {version}
  docs: Przewodnik
  meta: Dla Blendera {series}. Za darmo, na licencji GPL.
  shotAlt: 'Blender 5.1 z awatarem VRoid w widoku 3D i otwartymi panelami Quick Access oraz MMD Options zakładki CATS na pasku bocznym.'
  shotCaption: 'Cats w Blenderze 5.1, na przykładowym awatarze CC0 od VRoid po Fix MMD Model.'

