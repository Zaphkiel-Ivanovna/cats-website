hero:
  title: Prepara tus modelos importados para VRChat.
  lead: Cats toma el modelo que un importador acaba de dejar en Blender, renombra sus huesos, fusiona sus pesos, une sus mallas y limpia lo que sobra.
  download: Descargar la {version}
  docs: Leer la guía
  meta: Para Blender {series}. Gratis, bajo la GPL.
  shotAlt: 'Blender 5.1 con un avatar de VRoid en el viewport y los paneles Quick Access y MMD Options de la pestaña CATS abiertos en la barra lateral.'
  shotCaption: 'Cats en Blender 5.1, sobre el avatar de ejemplo CC0 de VRoid después de Fix MMD Model.'

