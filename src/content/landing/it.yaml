hero:
  title: Prepara i modelli importati per VRChat.
  lead: Cats prende il modello che un importer ha appena lasciato in Blender, rinomina le ossa, unisce i pesi e le mesh e fa pulizia di ciò che avanza.
  download: Scarica la {version}
  docs: Leggi la guida
  meta: Per Blender {series}. Gratuito, sotto licenza GPL.
  shotAlt: 'Blender 5.1 con un avatar VRoid nel viewport e i pannelli Quick Access e MMD Options della scheda CATS aperti nella barra laterale.'
  shotCaption: "Cats in Blender 5.1, sull'avatar di esempio CC0 di VRoid dopo Fix MMD Model."

